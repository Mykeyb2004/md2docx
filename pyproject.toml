[project]
name = "md2docx"
version = "0.1.0"
description = "Convert Markdown to Word documents with precise style control"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "md2docx Team" }
]
dependencies = [
    "mistune>=3.1.4",
    "python-docx>=1.1.2",
    "pyyaml>=6.0.3",
    "matplotlib>=3.5.0",
    "pillow>=9.0.0",
]

[project.scripts]
md2docx = "md2docx.cli:main"
md2docx-gui = "md2docx.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["md2docx"]
omit = ["tests/*", "md2docx/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "flake8>=5.0.4",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]
